<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Special Message</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #74ABE2, #5563DE);
      color: white;
      text-align: center;
      padding: 20px;
      overflow-x: hidden;
    }
    
    .floating-shapes {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }
    
    .shape {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      animation: float 15s infinite linear;
    }
    
    .shape:nth-child(1) {
      width: 80px;
      height: 80px;
      top: 20%;
      left: 10%;
      animation-duration: 20s;
    }
    
    .shape:nth-child(2) {
      width: 120px;
      height: 120px;
      top: 60%;
      left: 80%;
      animation-duration: 25s;
    }
    
    .shape:nth-child(3) {
      width: 60px;
      height: 60px;
      top: 80%;
      left: 20%;
      animation-duration: 15s;
    }
    
    .shape:nth-child(4) {
      width: 100px;
      height: 100px;
      top: 30%;
      left: 70%;
      animation-duration: 30s;
    }
    
    @keyframes float {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      50% {
        transform: translateY(-20px) rotate(180deg);
        opacity: 0.7;
      }
      100% {
        transform: translateY(0) rotate(360deg);
        opacity: 1;
      }
    }
    
    .card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 450px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
      transform: translateY(20px);
      opacity: 0;
      animation: fadeUp 0.8s ease-out forwards;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    @keyframes fadeUp {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    
    h1 {
      font-size: 28px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    .heart {
      animation: heartbeat 1.5s infinite;
      display: inline-block;
    }
    
    @keyframes heartbeat {
      0% { transform: scale(1); }
      5% { transform: scale(1.2); }
      10% { transform: scale(1.1); }
      15% { transform: scale(1.3); }
      50% { transform: scale(1); }
      100% { transform: scale(1); }
    }
    
    p {
      font-size: 16px;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    
    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
    }
    
    input, textarea {
      width: 100%;
      border-radius: 10px;
      border: none;
      outline: none;
      padding: 12px 15px;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.9);
      color: #333;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    
    input:focus, textarea:focus {
      background: white;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
      transform: translateY(-2px);
    }
    
    textarea {
      height: 120px;
      resize: none;
    }
    
    .btn-container {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      margin-top: 10px;
    }
    
    button {
      width: 100%;
      background: linear-gradient(to right, #00c6ff, #0078ff);
      border: none;
      padding: 15px;
      font-size: 16px;
      font-weight: 500;
      color: white;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      z-index: 1;
    }
    
    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 7px 20px rgba(0, 120, 255, 0.4);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    button::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to right, #0078ff, #00c6ff);
      z-index: -1;
      transition: opacity 0.3s ease;
      opacity: 0;
    }
    
    button:hover::after {
      opacity: 1;
    }
    
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.6);
      transform: scale(0);
      animation: ripple 0.6s linear;
      pointer-events: none;
    }
    
    @keyframes ripple {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }
    
    .loader {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin: 0 auto;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    #status {
      margin-top: 15px;
      font-size: 15px;
      min-height: 22px;
      transition: all 0.3s ease;
    }
    
    .success {
      color: #00ff88;
    }
    
    .error {
      color: #ff4d4d;
    }
    
    .warning {
      color: #ffcc00;
    }
    
    .footer {
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.8;
    }
    
    /* Mobile-specific adjustments */
    @media (max-width: 480px) {
      .card {
        padding: 20px;
        width: 95%;
      }
      
      h1 {
        font-size: 24px;
      }
      
      p {
        font-size: 15px;
      }
      
      textarea {
        height: 100px;
        padding: 12px;
      }
      
      button {
        padding: 14px;
      }
      
      .shape {
        display: none; /* Hide floating shapes on very small screens */
      }
    }
    
    @media (max-width: 360px) {
      h1 {
        font-size: 22px;
      }
      
      .card {
        padding: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="floating-shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
  </div>
  
  <div class="card">
    <h1><span class="heart">💌</span> Special Message</h1>
    <p>Hi there! Type your message below — it'll reach me by email instantly.</p>

    <div class="input-group">
      <label for="email">Your Email Address</label>
      <input type="email" id="email" placeholder="Enter your email address">
    </div>
    
    <div class="input-group">
      <label for="message">Your Message</label>
      <textarea id="message" placeholder="Write your heartfelt message here..."></textarea>
    </div>
    
    <div class="btn-container">
      <button id="sendBtn">
        <span id="btnText">Send Message</span>
        <div class="loader" id="loader"></div>
      </button>
    </div>

    <p id="status"></p>
  </div>
  
  <div class="footer">
    Made with <span class="heart">❤️</span> for you
  </div>

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
    // Initialize EmailJS with your public key
    (function(){
      emailjs.init("Sd1qAMSUrhSquUpZY");
    })();
    
    // Add ripple effect to button
    document.getElementById('sendBtn').addEventListener('click', function(e) {
      const btn = e.currentTarget;
      const ripple = document.createElement('span');
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const x = e.clientX - rect.left - size / 2;
      const y = e.clientY - rect.top - size / 2;
      
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = x + 'px';
      ripple.style.top = y + 'px';
      ripple.classList.add('ripple');
      
      btn.appendChild(ripple);
      
      setTimeout(() => {
        ripple.remove();
      }, 600);
    });

    function sendMessage() {
      const msg = document.getElementById("message").value.trim();
      const email = document.getElementById("email").value.trim();
      const status = document.getElementById("status");
      const btnText = document.getElementById("btnText");
      const loader = document.getElementById("loader");
      
      // Clear previous status
      status.innerText = "";
      status.className = "";
      
      // Validation
      if(!email) {
        status.innerText = "⚠️ Please enter your email address!";
        status.className = "warning";
        
        // Shake animation for empty email
        const emailInput = document.getElementById("email");
        emailInput.style.animation = "shake 0.5s";
        setTimeout(() => {
          emailInput.style.animation = "";
        }, 500);
        return;
      }
      
      // Validate email format
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if(!emailRegex.test(email)) {
        status.innerText = "⚠️ Please enter a valid email address!";
        status.className = "warning";
        
        // Shake animation for invalid email
        const emailInput = document.getElementById("email");
        emailInput.style.animation = "shake 0.5s";
        setTimeout(() => {
          emailInput.style.animation = "";
        }, 500);
        return;
      }
      
      if(!msg) {
        status.innerText = "⚠️ Please write a message before sending!";
        status.className = "warning";
        
        // Shake animation for empty message
        const textarea = document.getElementById("message");
        textarea.style.animation = "shake 0.5s";
        setTimeout(() => {
          textarea.style.animation = "";
        }, 500);
        return;
      }
      
      // Show loading state
      btnText.style.display = "none";
      loader.style.display = "block";
      
      // Prepare EmailJS parameters
      const params = {
        from_email: email,
        message: msg,
        to_email: "muntakim.16216@gmail.com" 
      };

      // Send email using EmailJS
      emailjs.send("service_y447ent", "template_6c3kbqh", params)
        .then(() => {
          status.innerText = "✅ Message sent successfully!";
          status.className = "success";
          document.getElementById("message").value = "";
          document.getElementById("email").value = "";
          
          // Confetti effect
          createConfetti();
        })
        .catch((err) => {
          console.error(err);
          status.innerText = "❌ Message failed to send. Please try again.";
          status.className = "error";
        })
        .finally(() => {
          // Reset button state
          btnText.style.display = "block";
          loader.style.display = "none";
        });
    }
    
    // Simple confetti effect
    function createConfetti() {
      const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
      const card = document.querySelector('.card');
      
      for (let i = 0; i < 50; i++) {
        const confetti = document.createElement('div');
        confetti.style.position = 'absolute';
        confetti.style.width = '10px';
        confetti.style.height = '10px';
        confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.borderRadius = '50%';
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.top = '-10px';
        confetti.style.opacity = '0.8';
        confetti.style.zIndex = '9999';
        document.body.appendChild(confetti);
        
        // Animate confetti
        const animation = confetti.animate([
          { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
          { transform: `translateY(${window.innerHeight}px) rotate(${Math.random() * 360}deg)`, opacity: 0 }
        ], {
          duration: 1000 + Math.random() * 2000,
          easing: 'cubic-bezier(0.1, 0.8, 0.3, 1)'
        });
        
        // Remove confetti after animation
        animation.onfinish = () => {
          confetti.remove();
        };
      }
    }
    
    // Add shake animation for validation
    const style = document.createElement('style');
    style.textContent = `
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
        20%, 40%, 60%, 80% { transform: translateX(5px); }
      }
    `;
    document.head.appendChild(style);
    
    // Add event listener for Enter key
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && (e.target.id === 'email' || e.target.id === 'message')) {
        sendMessage();
      }
    });
  </script>
</body>
</html>
